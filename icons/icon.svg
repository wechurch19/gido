<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3f9c"/>
      <stop offset=".45" stop-color="#0a6a9a"/>
      <stop offset="1" stop-color="#157f3a"/>
    </linearGradient>
    <radialGradient id="halo" cx="256" cy="232" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9fdcff" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#4aa0ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4aa0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".7" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#halo)"/>
  <g fill="#fff" opacity=".55">
    <circle cx="96" cy="120" r="3"/><circle cx="410" cy="96" r="2.5"/><circle cx="64" cy="300" r="2"/>
    <circle cx="448" cy="260" r="3"/><circle cx="150" cy="430" r="2.5"/><circle cx="380" cy="440" r="2"/>
    <circle cx="300" cy="70" r="2"/><circle cx="210" cy="60" r="2.5"/>
  </g>
  <g transform="translate(0 22)">
  <g filter="url(#glow)" opacity=".95">
    <rect x="238" y="96" width="36" height="270" rx="14" fill="#bfe6ff"/>
    <rect x="150" y="196" width="212" height="34" rx="14" fill="#bfe6ff"/>
  </g>
  <rect x="244" y="100" width="24" height="262" rx="10" fill="url(#beam)"/>
  <rect x="158" y="202" width="196" height="22" rx="10" fill="#fff"/>
  <rect x="70" y="208" width="372" height="10" rx="5" fill="url(#flare)" opacity=".9"/>
  </g>
